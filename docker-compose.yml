version: '3.12'

services:
  # --- 1. PostgreSQL Database ---
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: table_constructor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- 2. Python Backend (FastAPI) ---
  backend:
    build: 
      context: ./backend
    container_name: fastapi_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      # ИСПРАВЛЕНО: правильный формат переменных окружения
      DATABASE_URL: postgresql+psycopg2://user:password123@db:5432/table_constructor_db
      SECRET_KEY: your_super_secret_key
    depends_on:
      - db

  # --- 3. React Frontend ---
  frontend:
    build:
      context: ./frontend
    container_name: react_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: